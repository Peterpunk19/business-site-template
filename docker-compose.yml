services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: business-site-app

    restart: unless-stopped

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
      GA_PROPERTY_ID: ${GA_PROPERTY_ID}
      GOOGLE_ANALYTICS_CLIENT_EMAIL: ${GOOGLE_ANALYTICS_CLIENT_EMAIL}
      GOOGLE_ANALYTICS_PRIVATE_KEY: ${GOOGLE_ANALYTICS_PRIVATE_KEY}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    networks:
      - business-network

  postgres:
    image: postgres:17-alpine

    container_name: business-site-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - business-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder

    command: ["npx", "prisma", "migrate", "deploy"]

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - business-network

networks:
  business-network:

volumes:
  postgres_data:
